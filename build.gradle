plugins {
    id "fabric-loom" version "${fabric_loom_version}" apply false
}

allprojects {
    version = project.mod_version
    group = project.maven_group

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: "fabric-loom"

    archivesBaseName = project.mod_id + "-" + project.name
    int javaTarget = java_version as Integer

    repositories {
        maven { url = "https://cursemaven.com" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings "net.fabricmc:yarn:${yarn_mappings}:v2"

        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }

    processResources {
        filteringCharset "UTF-8"

        filesMatching("fabric.mod.json") {
            expand "mod_version": mod_version,
                    "mod_id": mod_id,
                    "mod_name": mod_name,
                    "mod_description": mod_description,
                    "minecraft_version": minecraft_version,
                    "loader_version": fabric_loader_version,
                    "mod_environment": project.name
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        if (javaTarget >= 10 || JavaVersion.current().isJava10Compatible()) {
            options.release.set(javaTarget)
        }
    }

    java {
        if (JavaVersion.current() < JavaVersion.toVersion(javaTarget)) {
            toolchain.languageVersion = JavaLanguageVersion.of(javaTarget)
        }
        withSourcesJar()
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${mod_id}" }
        }
    }
}
